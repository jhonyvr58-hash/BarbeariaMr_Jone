<!-- === FIM PARTE 5/15 === -->
<!-- === INÍCIO PARTE 6/15 === -->
        let appState = {
            adminPassword: '1234',
            slotStepMinutes: 15,
            expediente: JSON.parse(JSON.stringify(DEFAULT_EXPEDIENTE)),
            categories: [...DEFAULT_CATEGORIES],
            services: JSON.parse(JSON.stringify(INITIAL_SERVICES)),
            barbers: JSON.parse(JSON.stringify(INITIAL_BARBERS)),
            bookings: [],
            blockedRanges: [],
            accountingFilterBarber: 'todos',
            accountingFilterPeriod: 'mes'
        };

        let knownBookingIds = new Set();
        let pollTimer = null;

        function horaParaMin(hhmm) {
            if (!hhmm || !hhmm.includes(':')) return 0;
            const [h, m] = hhmm.split(':').map(Number);
            return (h * 60) + m;
        }

        function minParaHora(totalMin) {
            const h = String(Math.floor(totalMin / 60)).padStart(2, '0');
            const m = String(totalMin % 60).padStart(2, '0');
            return `${h}:${m}`;
        }

        function formatBRL(val) {
            return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
        }

        function loadSavedData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.adminPassword) appState.adminPassword = parsed.adminPassword;
                if (parsed.slotStepMinutes) appState.slotStepMinutes = Number(parsed.slotStepMinutes);
                if (parsed.expediente) appState.expediente = { ...DEFAULT_EXPEDIENTE, ...parsed.expediente };
                if (Array.isArray(parsed.services) && parsed.services.length) appState.services = parsed.services;
                if (Array.isArray(parsed.categories) && parsed.categories.length) appState.categories = parsed.categories;
                if (Array.isArray(parsed.barbers) && parsed.barbers.length) appState.barbers = parsed.barbers;
                if (Array.isArray(parsed.bookings)) appState.bookings = parsed.bookings;
                if (Array.isArray(parsed.blockedRanges)) appState.blockedRanges = parsed.blockedRanges;
            } catch (e) {}
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    adminPassword: appState.adminPassword,
                    slotStepMinutes: appState.slotStepMinutes,
                    expediente: appState.expediente,
                    categories: appState.categories,
                    services: appState.services,
                    barbers: appState.barbers,
                    bookings: appState.bookings,
                    blockedRanges: appState.blockedRanges
                }));
            } catch (e) {}
        }
<!-- === FIM PARTE 6/15 === -->
<!-- === INÍCIO PARTE 7/15 === -->
        function checkRememberedSession() {
            try {
                const saved = localStorage.getItem(SESSION_KEY);
                if (saved === String(appState.adminPassword)) {
                    openDashboard();
                }
            } catch (e) {}
        }

        function verifyLogin() {
            const pass = document.getElementById('pass-input').value.trim();
            const remember = document.getElementById('remember-device-check').checked;
            if (pass === String(appState.adminPassword)) {
                if (remember) {
                    try { localStorage.setItem(SESSION_KEY, pass); } catch (e) {}
                }
                openDashboard();
            } else {
                showToast('Senha incorreta!');
            }
        }

        function logoutAdminSession() {
            try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('pass-input').value = '';
            showToast('Sessão encerrada.');
        }

        function openDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'inline-block';
            renderActiveTab();
            syncBookingsFromFirebase({ silentNewAlert: true });
        }

        async function pushBookingToFirebase(booking) {
            if (!FIREBASE_DB_URL || !booking) return;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/bookings.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(booking)
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.name) {
                        booking.firebaseKey = data.name;
                        saveData();
                    }
                }
            } catch (e) {}
        }

        async function patchBookingInFirebase(booking) {
            if (!FIREBASE_DB_URL || !booking || !booking.firebaseKey) return;
            try {
                await fetch(`${FIREBASE_DB_URL}/bookings/${booking.firebaseKey}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: booking.status })
                });
            } catch (e) {}
        }

        async function deleteBookingFromFirebase(booking) {
            if (!FIREBASE_DB_URL || !booking || !booking.firebaseKey) return;
            try {
                await fetch(`${FIREBASE_DB_URL}/bookings/${booking.firebaseKey}.json`, {
                    method: 'DELETE'
                });
            } catch (e) {}
        }

        async function syncBookingsFromFirebase(options = {}) {
            const { silentNewAlert = false } = options;
            if (!FIREBASE_DB_URL) return;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/bookings.json?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;
                const rawData = await res.json();

                const hadInit = knownBookingIds.size > 0;
                const cloudList = [];
                if (rawData && typeof rawData === 'object') {
                    Object.entries(rawData).forEach(([firebaseKey, item]) => {
                        if (item && typeof item === 'object') {
                            cloudList.push({ ...item, firebaseKey });
                        }
                    });
                }

                cloudList.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                const newOnes = [];
                if (hadInit && !silentNewAlert) {
                    cloudList.forEach(b => {
                        if (b.id && !knownBookingIds.has(b.id) && b.status !== 'cancelado') {
                            newOnes.push(b);
                        }
                    });
                }

                knownBookingIds = new Set(cloudList.map(b => b.id).filter(Boolean));
                appState.bookings = cloudList;
                saveData();

                const statusEl = document.getElementById('sync-status-label');
                if (statusEl) statusEl.textContent = `Firebase online • ${cloudList.length} registro(s)`;

                if (document.getElementById('dashboard-view').style.display !== 'none') {
                    renderAgenda();
                    renderContabilidade();
                }

                if (newOnes.length > 0) {
                    triggerBookingNotification(newOnes[0]);
                }
            } catch (e) {
                const statusEl = document.getElementById('sync-status-label');
                if (statusEl) statusEl.textContent = 'Sem conexão com o banco';
            }
        }

        function requestDeviceNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('Navegador sem suporte a notificação nativa.');
                return;
            }
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                    showToast('Notificações ativadas neste celular!');
                    playBookingAlertSound();
                } else {
                    showToast('Permissão de notificação negada ou bloqueada.');
                }
            });
        }

        function playBookingAlertSound() {
            try { if (navigator.vibrate) navigator.vibrate([180, 90, 180]); } catch (e) {}
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                [587.33, 880].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.14);
                    gain.gain.setValueAtTime(0.08, now + idx * 0.14);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + idx * 0.14);
                    osc.stop(now + idx * 0.14 + 0.26);
                });
            } catch (e) {}
        }

        function calcularFinanceiroAgendamento(booking) {
            let receitaSessao = 0;
            let comissaoBarbeiro = 0;
            let valorCobradoClienteNoDia = 0;

            (booking.items || []).forEach(item => {
                const sessoes = item.isPlan ? (Number(item.sessionsPerMonth) || 4) : 1;
                const valorPorSessao = Number(item.price) / sessoes;
                receitaSessao += valorPorSessao;
                comissaoBarbeiro += valorPorSessao * 0.50;
                valorCobradoClienteNoDia += (booking.payment === 'Plano Mensal (Assinante)' && item.isPlan) ? 0 : Number(item.price);
            });

            return { receitaSessao, comissaoBarbeiro, lucroBarbearia: receitaSessao - comissaoBarbeiro, valorCobradoClienteNoDia };
        }

                    </div>
                </div>
                <div class="admin-item-card" style="display:flex; flex-direction:column; gap:10px;">
                    <label class="field-label">Alterar Senha do Proprietário</label>
                    <div style="display:flex; gap:8px;">
                        <input type="password" id="new-admin-pass" class="field-input" style="padding:8px;" placeholder="Nova senha">
                        <button type="button" class="btn-secondary" style="width:auto; padding:8px 14px;" onclick="changeAdminPassword()">Salvar</button>
                    </div>
                </div>
            `;
        }

        function changeAdminPassword() {
            const p = document.getElementById('new-admin-pass').value.trim();
            if (!p || p.length < 4) { showToast('A senha deve ter pelo menos 4 caracteres.'); return; }
            appState.adminPassword = p;
            saveData();
            try { if (localStorage.getItem(SESSION_KEY)) localStorage.setItem(SESSION_KEY, p); } catch (e) {}
            document.getElementById('new-admin-pass').value = '';
            showToast('Senha atualizada!');
        }

        window.addEventListener('DOMContentLoaded', async () => {

            pollTimer = setInterval(() => {
